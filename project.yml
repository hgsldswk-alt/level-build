name: LevelTool
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.level
    APP_STORE_ID: "__APP_STORE_ID__"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  LevelTool:
    type: application
    platform: iOS
    sources: [LevelTool, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: LevelTool AppStore
    info:
      path: LevelTool/Info.plist
      properties:
        CFBundleDisplayName: 水平仪
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LevelProProductID: $(APP_ID).pro
        LevelTrialProductID: $(APP_ID).trial
        APP_STORE_ID: $(APP_STORE_ID)
        NSCameraUsageDescription: 只在取景或为记录拍照时使用相机，不录音、不打开闪光灯。
        NSPhotoLibraryAddUsageDescription: 将你选择的取景照片和分享图保存到相册。
  LevelToolTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LevelToolTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  LevelToolUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LevelToolUITests]
    dependencies:
      - target: LevelTool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LevelTool
schemes:
  LevelTool:
    build:
      targets:
        LevelTool: all
        LevelToolTests: [test]
    test:
      config: Debug
      targets: [LevelToolTests]
  LevelToolUI:
    build:
      targets:
        LevelTool: all
        LevelToolUITests: [test]
    test:
      config: Debug
      targets: [LevelToolUITests]
